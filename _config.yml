title: "Игристые классического метода"
description: "Сводная таблица мировых категорий игристых вин классического метода и где их купить в Санкт-Петербурге"
lang: ru-RU

# Используем встроенную тему GitHub Pages
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag

relative_links:
  enabled: true
  collections: true

# Чтобы README.md не публиковался как страница
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/

# SEO
author: "Sparkling Wine Guide"
twitter:
  card: summary_large_image
